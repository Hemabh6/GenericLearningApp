<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}body{margin:0}</style><title>Learning Desk Admin</title>
<style>
:root{
  --surface:#ffffff;--surface-warm:#f4efe7;--border:#ddd5c8;--field:#ffffff;
  --ink:#000000;--ink-muted:#595959;
  --bronze:#8f5a39;--accent-text:#8f5a39;--blue:#117aca;--navy:#004b87;--link:#004b87;--on-accent:#ffffff;
  --ok:#1f6f45;--bad:#b3261e;--warn:#8a5a00;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:4px;--r-md:8px;--s1:8px;--s2:16px;--s3:24px;--s4:40px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#000;--surface-warm:#161412;--border:#2e2a26;--field:#0d0c0b;--ink:#fff;--ink-muted:#b5b5b5;
  --accent-text:#c8956f;--link:#117aca;--ok:#4cc38a;--bad:#ff8a80;--warn:#e0b04a}}
:root[data-theme="dark"]{
  --surface:#000;--surface-warm:#161412;--border:#2e2a26;--field:#0d0c0b;--ink:#fff;--ink-muted:#b5b5b5;
  --accent-text:#c8956f;--link:#117aca;--ok:#4cc38a;--bad:#ff8a80;--warn:#e0b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/22px var(--sans);padding-inline:var(--s2)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:36px}h2{font-size:22px;line-height:28px}h3{font-size:17px;line-height:24px}
p{margin:0}a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.muted{color:var(--ink-muted)}.small{font-size:13px;line-height:18px}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--border);margin-inline:calc(var(--s2) * -1);padding-inline:var(--s2)}
.bar .in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--serif);font-size:20px;white-space:nowrap}
.badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--bronze);color:var(--accent-text);border-radius:var(--r-sm);padding:1px 6px}
.sp{flex:1}
#menuBtn{display:none;flex-direction:column;justify-content:center;gap:4px;width:44px;height:44px;margin-left:-10px;background:none;border:0;padding:0 10px;cursor:pointer}
#menuBtn span{display:block;height:2px;background:var(--ink);border-radius:1px}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap}
.pill.dirty{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bronze);background:var(--bronze);color:var(--on-accent);border-radius:var(--r-md);padding:8px 16px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ink-muted);font-weight:500}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad);font-weight:500}
#themeBtn{background:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 10px;cursor:pointer;font-size:13px;color:var(--ink-muted);min-height:32px}

/* layout */
.app{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s4);padding-block:var(--s3) var(--s4)}
#side{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start}
#side .dh{display:none}
#side button[data-v]{text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--ink-muted);font-size:15px;min-height:44px;display:flex;justify-content:space-between;gap:8px}
#side button[data-v]:hover{color:var(--ink)}
#side button[aria-current="page"]{color:var(--ink);border-left-color:var(--bronze);background:var(--surface-warm);font-weight:600}
#side .ct{font-size:12px;color:var(--ink-muted);font-weight:400}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#view{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.head{display:flex;flex-direction:column;gap:4px}
.head p{max-width:64ch;color:var(--ink-muted)}
.sec{display:flex;flex-direction:column;gap:var(--s2)}
.sec+.sec{border-top:1px solid var(--border);padding-top:var(--s3)}
.band{background:var(--surface-warm);border-radius:var(--r-md);padding:var(--s2)}

/* forms */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.lab{font-size:13px;font-weight:600}
.fx{border:1px solid var(--ink-muted);border-radius:var(--r-md);background:var(--field);padding:9px 12px;min-height:42px;width:100%;min-width:0}
.fx:focus-visible{outline-offset:1px}
textarea.fx{resize:vertical;min-height:64px}
select.fx{padding-right:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s2)}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--border);position:relative;cursor:pointer;flex:none;margin:0;border:1px solid var(--ink-muted)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-muted);transition:transform .15s}
.sw:checked{background:var(--bronze);border-color:var(--bronze)}
.sw:checked::after{transform:translateX(18px);background:#fff}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .t{display:flex;flex-direction:column;min-width:0}

/* menu rows */
.mrow{display:grid;grid-template-columns:auto minmax(120px,1.3fr) minmax(130px,1fr) minmax(130px,1fr) auto auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--border);border-radius:var(--r-md)}
.mrow.off{background:var(--surface-warm)}
.mrow .mv{display:flex;flex-direction:column;gap:2px}
.ib{width:32px;height:28px;border:1px solid var(--border);background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-muted);line-height:1}
.ib:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}.ib:disabled{opacity:.35;cursor:default}
.tg{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tg label{font-size:13px;font-weight:600}
.mlist{display:flex;flex-direction:column;gap:var(--s1)}
.url{grid-column:2/-1}

/* preview */
.pv{display:flex;flex-direction:column;gap:12px}
.pvbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px;display:flex;gap:2px;overflow-x:auto;align-items:center;min-height:46px}
.pvbar b{font-family:var(--serif);font-weight:400;margin-right:12px;white-space:nowrap}
.pvbar span{padding:12px 10px 10px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--ink-muted);font-size:14px}
.pvbar span:first-of-type{border-bottom-color:var(--bronze);color:var(--ink);font-weight:600}
.pvph{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.phone{width:170px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:6px 0;font-size:13px}
.phone div{padding:7px 12px}.phone div:first-child{border-left:3px solid var(--bronze);background:var(--surface-warm);font-weight:600;padding-left:9px}
.empty{color:var(--ink-muted);font-size:13px;padding:8px 12px}

/* tests */
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--s3);align-items:start}
.tl{display:flex;flex-direction:column;gap:6px}
.tl button.it{text-align:left;background:none;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px}
.tl button.it[aria-current="true"]{border-color:var(--bronze);background:var(--surface-warm)}
.qc{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s2);display:flex;flex-direction:column;gap:12px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt{display:flex;align-items:center;gap:10px}
.opt input[type=radio]{width:20px;height:20px;accent-color:var(--bronze);margin:0;flex:none}
.opt .fx{min-height:38px;padding:6px 10px}

/* people */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--surface-warm)}
.who{display:flex;flex-direction:column}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink-muted)}
.chip.c{border-color:var(--bronze);color:var(--accent-text)}
.chip.p{border-color:var(--warn);color:var(--warn)}
.acc{display:grid;grid-template-columns:minmax(0,1fr) 160px 90px;gap:8px 12px;align-items:center}
.acc>.h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.inv{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end}
pre{margin:0;font:12px/18px var(--mono);background:var(--surface-warm);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s2);overflow:auto;max-height:520px}
.err{color:var(--bad);font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);border-radius:var(--r-md);padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);font-size:14px}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;padding:4px}

.imp .steps{margin:0;padding-left:20px;color:var(--ink-muted);font-size:14px}
.imp .steps li{padding:1px 0}
.imp .acts,.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imp textarea{font:12px/18px var(--mono);min-height:120px;white-space:pre}
.imp .sum{font-size:14px}
.imp .pt{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-md)}
.imp table{min-width:480px}
.imp td,.imp th{padding:7px 12px;font-size:13px}
.imp .fixme{color:var(--bad)}
.imp .good{color:var(--ok)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--link);outline-offset:2px}
.nudge{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:space-between;background:var(--surface-warm);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px}
.tourlink{margin-top:var(--s2);background:none;border:0;border-left:3px solid transparent;text-align:left;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--accent-text);font-size:14px;font-weight:600}
#tourLayer{position:fixed;inset:0;z-index:50}
#tourHole{position:fixed;border-radius:8px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--bronze),0 0 0 9999px rgba(0,0,0,.62);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
#tourCard{position:fixed;width:340px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:6px}
#tourCard .acts{margin-top:12px}
.rolesel{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px}
.rolesel .lab{flex-basis:100%}
.cb{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:400;cursor:pointer;min-height:32px}
.cb input{width:18px;height:18px;accent-color:var(--bronze);margin:0}
.cbs{display:flex;flex-wrap:wrap;gap:4px 18px}
.pg{display:flex;flex-direction:column}
.pg .row select{width:270px;max-width:100%;min-height:38px;flex:none}
.row{flex-wrap:wrap}
.eff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 16px;font-size:14px}
.eff>span:nth-child(odd){color:var(--ink-muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.x{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px}
.chip.x button{background:none;border:0;cursor:pointer;color:var(--ink-muted);font-size:16px;line-height:1;padding:2px 6px}
.addrow{display:flex;gap:8px}
.nr{margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--border)}
#glance{min-width:560px}
#glance td,#glance th{font-size:13px;padding:8px 12px}
@media (max-width:960px){
  .app{grid-template-columns:1fr;gap:0}
  #menuBtn{display:inline-flex}
  #side{position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);z-index:21;background:var(--surface);border-right:1px solid var(--border);padding:0 0 var(--s3);transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;overflow-y:auto}
  #side.open{transform:none;visibility:visible;transition:transform .22s ease}
  #side .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
  #navClose{background:none;border:0;font-size:28px;width:44px;height:44px;cursor:pointer;color:var(--ink-muted)}
  #side button[data-v]{min-height:48px}
  body.navopen{overflow:hidden}
}
@media (max-width:760px){
  h1{font-size:26px;line-height:32px}
  .mrow{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
  .mrow .f.nm{grid-column:2/3}
  .mrow .mv{grid-row:span 2}
  .mrow .f.ty,.mrow .f.vi{grid-column:2/-1}
  .mrow .tg,.mrow .del{grid-column:2/-1}
  .url{grid-column:2/-1}
  .split{grid-template-columns:1fr}
  .inv{grid-template-columns:1fr}
  #discard,#statePill,.badge{display:none}
  .bar .in{gap:8px}
  .brand{font-size:18px}
  .acc{grid-template-columns:minmax(0,1fr) 130px 64px}
}
@media (pointer:coarse){.ib{width:40px;height:36px}.sw{width:48px;height:28px}.sw::after{width:22px;height:22px}.sw:checked::after{transform:translateX(20px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<header class="bar"><div class="in">
  <button id="menuBtn" type="button" aria-label="Open admin menu" aria-controls="side" aria-expanded="false"><span></span><span></span><span></span></button>
  <span class="brand">Learning Desk</span><span class="badge">Admin</span>
  <span class="sp"></span>
  <span class="pill" id="statePill">All changes published</span>
  <button class="btn ghost sm" id="discard" type="button" disabled>Discard</button>
  <button class="btn sm" id="publish" type="button" disabled>Publish</button>
  <button id="themeBtn" type="button" aria-label="Toggle light or dark theme">Theme</button>
</div></header>
<div id="scrim" hidden></div>

<div class="app">
  <nav id="side" aria-label="Admin sections">
    <div class="dh"><span class="brand">Admin</span><button id="navClose" type="button" aria-label="Close menu">&times;</button></div>
    <button data-v="site">Site settings</button>
    <button data-v="menus">Menus &amp; pages <span class="ct" id="ctMenus"></span></button>
    <button data-v="tests">Tests <span class="ct" id="ctTests"></span></button>
    <button data-v="people">People &amp; access <span class="ct" id="ctPeople"></span></button>
    <button data-v="roles">Roles &amp; permissions <span class="ct" id="ctRoles"></span></button>
    <button data-v="config">Config (JSON)</button>
    <button class="tourlink" type="button" data-tour="overview">Take the admin tour</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" role="status" hidden></div>
<div id="tourLayer" hidden>
  <div id="tourHole"></div>
  <div id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourT">
    <div class="eyebrow" id="tourN"></div>
    <h3 id="tourT"></h3>
    <p id="tourP" class="small"></p>
    <div class="acts"><button class="btn ghost sm" id="tourBack" type="button">Back</button><button class="btn sm" id="tourNext" type="button">Next</button><button class="btn ghost sm" id="tourSkip" type="button">Skip tour</button></div>
  </div>
</div>

<script>
(function(){
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function uid(){return Math.random().toString(36).slice(2,8)}
  var KEY="learningdesk.admin.v1";
  var TYPES=[["home","Home"],["videos","Videos & content"],["notes","Notes & reference"],["roadmap","Timeline & roadmap"],["tests","Tests"],["faq","FAQ"],["attendance","Attendance"],["results","Test results"],["custom","Custom page"],["link","External link"]];
  var ACCESS=[["everyone","Everyone (incl. guests)"],["signed","Signed-in users"],["roles","Only chosen roles"]];
  var RES=[["none","No results"],["own","Their own only"],["subjects","Students in their subjects"],["classes","Students in their classes"],["all","Everyone's results"]];
  var ATT=[["none","No attendance"],["own","Their own only"],["classes","Students in their classes"],["all","Everyone's attendance"]];
  var SHORT={none:"None",own:"Own only",subjects:"Their subjects",classes:"Their classes",all:"Everyone"};
  var PERMS=[
    {k:"menus",g:"Website",t:"Change menus and site settings",d:"Add, rename, hide and reorder menus.",type:"bool"},
    {k:"content",g:"Content",t:"Edit videos, notes and pages",d:"Add and change learning content.",type:"bool"},
    {k:"tests",g:"Content",t:"Create and edit tests",d:"Write tests and questions.",type:"bool"},
    {k:"results",g:"Student data",t:"See test results",d:"Whose scores this role can open.",type:"scope",o:RES},
    {k:"attendance",g:"Student data",t:"See attendance",d:"Whose attendance this role can open.",type:"scope",o:ATT},
    {k:"mark",g:"Student data",t:"Mark attendance",d:"Record who was present.",type:"bool"},
    {k:"export",g:"Student data",t:"Download reports",d:"Export results and attendance.",type:"bool"},
    {k:"people",g:"People",t:"Invite people and change their roles",d:"Manage the people list.",type:"bool"},
    {k:"roles",g:"People",t:"Create and edit roles",d:"Change what each role can do.",type:"bool"}
  ];
  function P(o){var b={menus:false,content:false,tests:false,results:"none",attendance:"none",mark:false,export:false,people:false,roles:false},k;for(k in o)b[k]=o[k];return b}
  function defRoles(){return[
    {id:"admin",name:"Admin",desc:"Manages everything. This can't be changed.",builtin:true,perms:P({menus:true,content:true,tests:true,results:"all",attendance:"all",mark:true,export:true,people:true,roles:true})},
    {id:"editor",name:"Editor",desc:"Changes content and tests.",builtin:true,perms:P({content:true,tests:true,results:"all"})},
    {id:"learner",name:"Learner",desc:"Uses the site and saves their own progress.",builtin:true,perms:P({results:"own",attendance:"own"})},
    {id:"viewer",name:"Viewer",desc:"Can read but not save progress.",builtin:true,perms:P({})}
  ]}
  function seed(){return{
    site:{name:"Learning Desk",tagline:"Videos, notes, roadmap and tests in one place.",landing:"m1",signin:true,guest:true,signup:true},
    roles:defRoles().concat([
      {id:"r_teacher",name:"Teacher",desc:"Teaches one or more subjects. Sees results for those subjects only.",perms:P({content:true,tests:true,results:"subjects"})},
      {id:"r_ct",name:"Class teacher",desc:"Looks after a class. Sees its attendance and results and can mark attendance.",perms:P({content:true,tests:true,results:"classes",attendance:"classes",mark:true,export:true})}
    ]),
    subjects:["Maths","Science","English"],classes:["6A","6B","7A"],
    menus:[
      {id:"m1",name:"Home",type:"home",access:"everyone",roles:[],visible:true},
      {id:"m2",name:"Videos & Content",type:"videos",access:"everyone",roles:[],visible:true},
      {id:"m3",name:"Notes & Reference",type:"notes",access:"signed",roles:[],visible:true},
      {id:"m4",name:"Timeline & Roadmap",type:"roadmap",access:"signed",roles:[],visible:true},
      {id:"m5",name:"Tests",type:"tests",access:"signed",roles:[],visible:true},
      {id:"m8",name:"Results",type:"results",access:"roles",roles:["editor","r_teacher","r_ct"],visible:true},
      {id:"m9",name:"Attendance",type:"attendance",access:"roles",roles:["r_ct"],visible:true},

      {el:function(){return $("assign")},t:"Subjects and classes",p:"Assign the subjects a teacher teaches and the classes they look after. Roles limited to 'their subjects' or 'their classes' use these."},
      {el:function(){return $("effective")},t:"What they can do",p:"A plain summary of this person's permissions, combining their role and assignments. Check it before you publish."},
      {el:function(){return q(".acc")},t:"Override a page",p:"Role default follows the menu setting. Always allow opens a page for this person, and Block closes it."},
      {el:function(){return $("imp-people")},t:"Invite many at once",p:"Download the CSV template with Email, Name, Role, Subjects and Classes, then load it. Admins are never added in bulk."}
    ],
    config:[
      {el:function(){return $("cfg")},t:"The setup file",p:"This is everything you configured, written as one JSON file. Your Angular or React app reads it at start-up to build the menus, tests and access rules."},
      {el:function(){return q('[data-act="exportcfg"]')},t:"Download a copy",p:"Save the current setup as a file, for a backup or to reuse in another course."},
      {el:function(){return $("imp-config")},t:"Load a whole setup",p:"Load a setup file to replace everything at once. The preview checks it first, and you can undo right after."}
    ]
  };
  var NUDGE={site:"A short tour shows what each setting on this page does.",menus:"A short tour shows how to rename, reorder, hide and restrict menus.",tests:"A short tour shows how to build tests and questions.",people:"A short tour shows how invites, assignments and page access work.",roles:"A short tour shows how to create roles like Teacher and set what they can see.",config:"A short tour explains the config file and how to load one."};
  var tour=null,tourFrom=null;
  function tsave(){try{localStorage.setItem(TKEY,JSON.stringify(seen))}catch(e){}}
  function tvis(el){return el&&el.getClientRects().length>0}
  function tourPos(){
    if(!tour)return;
    var card=$("tourCard"),hole=$("tourHole"),st=TOURS[tour.name][tour.i],el=st.el();if(!tvis(el))return;
    var r=el.getBoundingClientRect(),vh=innerHeight,vw=innerWidth,pad=6,top=Math.max(r.top,70),h=Math.min(r.bottom,vh)-top;
    if(r.height>vh*.55)h=Math.min(r.height,vh*.45);h=Math.max(h,24);
    hole.style.left=Math.max(r.left-pad,4)+"px";hole.style.top=(top-pad)+"px";hole.style.width=Math.min(r.width+pad*2,vw-8)+"px";hole.style.height=(h+pad*2)+"px";
    var cw=card.offsetWidth,ch=card.offsetHeight;
    if(vw<600){card.style.left="12px";card.style.right="12px";card.style.width="auto";card.style.top="auto";card.style.bottom="12px";return}
    card.style.right="auto";card.style.bottom="auto";card.style.width="";
    var below=top+h+pad*2+14,x=Math.min(Math.max(r.left,12),vw-cw-12),y;
    if(below+ch<vh-12)y=below;else if(top-pad-14-ch>12)y=top-pad-14-ch;else y=Math.max(vh-ch-16,12);
    card.style.left=x+"px";card.style.top=y+"px";
  }
  function tourStep(dir){
    var steps=TOURS[tour.name],st=steps[tour.i],el=st.el();
    if(!tvis(el)){var n=tour.i+(dir||1);if(n>=0&&n<steps.length){tour.i=n;return tourStep(dir)}return endTour(true)}
    el.style.scrollMarginTop="90px";
    var tall=el.getBoundingClientRect().height>innerHeight*.55;
    el.scrollIntoView({block:tall?"start":"center"});
    $("tourN").textContent="Step "+(tour.i+1)+" of "+steps.length;$("tourT").textContent=st.t;$("tourP").textContent=st.p;
    $("tourBack").hidden=tour.i===0;$("tourNext").textContent=tour.i===steps.length-1?"Done":"Next";
    requestAnimationFrame(function(){tourPos();$("tourNext").focus()});
  }
  function startTour(name){
    if(!TOURS[name])return;
    closeNav(true);
    if(name!=="overview"&&view!==name)go(name);
    tourFrom=document.activeElement;tour={name:name,i:0};$("tourLayer").hidden=false;tourStep(1);
  }
  function endTour(){
    if(!tour)return;seen[tour.name]=1;tsave();tour=null;$("tourLayer").hidden=true;
    var n=document.querySelector(".nudge");if(n&&seen[view])n.hidden=true;
    if(tourFrom&&tourFrom.focus)try{tourFrom.focus()}catch(e){}
  }
  $("tourNext").onclick=function(){if(tour.i>=TOURS[tour.name].length-1)endTour();else{tour.i++;tourStep(1)}};
  $("tourBack").onclick=function(){if(tour.i>0){tour.i--;tourStep(-1)}};
  $("tourSkip").onclick=function(){endTour()};
  document.addEventListener("keydown",function(e){
    if(!tour)return;
    if(e.key==="Escape"){e.preventDefault();endTour()}
    else if(e.key==="ArrowRight"){e.preventDefault();$("tourNext").click()}
    else if(e.key==="ArrowLeft"){e.preventDefault();$("tourBack").click()}
    else if(e.key==="Tab"){var f=[$("tourBack"),$("tourNext"),$("tourSkip")].filter(function(b){return !b.hidden}),i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?f.length-1:1))%f.length].focus()}
  },true);
  window.addEventListener("resize",tourPos);window.addEventListener("scroll",tourPos,true);
  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-tour]"),d=e.target.closest("[data-tourdismiss]");
    if(t)startTour(t.dataset.tour);
    if(d){seen[d.dataset.tourdismiss]=1;tsave();var n=d.closest(".nudge");if(n)n.hidden=true}
  });
  function tourChrome(){
    var h=q("#view .head");if(!h||!TOURS[view])return;
    h.insertAdjacentHTML("beforeend",'<div class="acts"><button class="btn ghost sm" type="button" data-tour="'+view+'">Take the tour of this page</button></div>');
    if(!seen[view]){
      var first=!seen.overview;
      h.insertAdjacentHTML("afterend",'<div class="nudge"><span>'+(first?"New here? A one-minute tour shows how the admin page works. ":"New here? ")+(first?"":NUDGE[view])+'</span><span class="acts"><button class="btn sm" type="button" data-tour="'+(first?"overview":view)+'">Start the tour</button><button class="btn ghost sm" type="button" data-tourdismiss="'+(first?"overview":view)+'">Not now</button></span></div>');
    }
  }

  render();
})();
</script>
</body></html>
