# Local development only: Postgres on the host's port 5432, nothing else.
# The app runs outside Docker with `dotnet run`, so the inner loop stays fast.
#   docker compose -f compose.dev.yaml up -d
name: genericlearningapp-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genericlearningapp
      POSTGRES_USER: gla
      POSTGRES_PASSWORD: gla_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gla -d genericlearningapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev-db-data:
